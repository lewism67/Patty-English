<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#f7f2e8">
<title>Patty’s English Lesson</title>
<style>
:root{
  --cream:#f8f3e9;
  --paper:#fffdfa;
  --ink:#17231f;
  --muted:#7b837e;
  --green:#2f6b59;
  --green2:#244f43;
  --blue:#4d78a8;
  --gold:#c89a42;
  --red:#b74b52;
  --line:#d7ded9;
  --good:#e8f5ee;
  --bad:#fff0ec;
  --shadow:0 12px 35px rgba(31,54,46,.08);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{
  margin:0;background:
    radial-gradient(circle at 88px 120px,rgba(77,120,168,.08),transparent 120px),
    radial-gradient(circle at calc(100% - 20px) 180px,rgba(200,154,66,.10),transparent 150px),
    var(--cream);
  color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans Thai",Tahoma,sans-serif;
  min-height:100vh;
}
button{font:inherit;color:inherit}
.shell{max-width:760px;margin:auto;min-height:100vh;padding:calc(18px + env(safe-area-inset-top)) 18px calc(28px + env(safe-area-inset-bottom))}
.brandrow{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:22px}
.backbtn,.homebtn{
  min-height:54px;padding:0 18px;border:1px solid var(--line);border-radius:18px;background:rgba(255,255,255,.72);
  font-weight:750;box-shadow:0 4px 16px rgba(26,47,39,.03)
}
.brandmark{display:flex;align-items:center;gap:8px;font-size:15px;color:var(--muted);font-weight:700;letter-spacing:.05em}
.flag{font-size:23px}
.hero{position:relative;padding:6px 0 16px;overflow:hidden}
.hero::after{
  content:"";position:absolute;right:-32px;top:-12px;width:170px;height:170px;border-radius:50%;
  background:linear-gradient(140deg,rgba(77,120,168,.09),rgba(200,154,66,.08));z-index:-1
}
.eyebrow{font-size:13px;letter-spacing:.18em;font-weight:800;color:#66736d;text-transform:uppercase}
h1{font-family:Georgia,"Times New Roman",serif;font-size:clamp(38px,10vw,58px);line-height:1.02;margin:14px 0 10px;letter-spacing:-.035em}
.subtitle{font-size:20px;color:var(--muted);line-height:1.5;margin:0}
.bridge{display:flex;align-items:center;gap:9px;margin-top:18px;color:#65716b;font-weight:700;font-size:13px;letter-spacing:.11em}
.bridge .line{height:1px;flex:1;background:linear-gradient(90deg,transparent,#cfd6d2)}
.progresswrap{margin:10px 0 26px}
.progressbar{height:10px;border-radius:999px;background:#dce2de;overflow:hidden}
.progressbar>div{height:100%;width:0;background:linear-gradient(90deg,var(--green),#4c8874);transition:.25s}
.card{
  position:relative;background:rgba(255,255,255,.91);border:1px solid var(--line);border-radius:28px;
  padding:24px;margin-bottom:16px;box-shadow:var(--shadow);overflow:hidden
}
.card::before{
  content:"";position:absolute;right:-50px;bottom:-55px;width:140px;height:140px;border:1px solid rgba(200,154,66,.18);
  border-radius:45% 55% 50% 50%;transform:rotate(18deg)
}
.quizhead{display:flex;gap:14px;align-items:flex-start;margin-bottom:18px}
.iconbubble{width:54px;height:54px;flex:0 0 54px;border-radius:50%;display:grid;place-items:center;background:#f8f0df;color:var(--green);font-size:25px}
.qthai{font-size:27px;line-height:1.34;font-weight:850;margin:2px 0 5px}
.qenglish{font-size:17px;line-height:1.45;color:#89908c}
.options{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.option{
  min-height:88px;border:1.5px solid #d7ded9;background:#fff;border-radius:22px;padding:14px;
  font-weight:850;font-size:21px;display:flex;align-items:center;justify-content:center;text-align:center;transition:.15s
}
.option:active{transform:scale(.985)}
.option.correct{background:var(--good);border-color:#85b49e}
.option.wrong{background:var(--bad);border-color:#e7a99d}
.feedback{font-weight:800;margin:15px 2px 0;min-height:26px;line-height:1.45}
.feedback.good{color:#2c6f53}.feedback.bad{color:#a75047}
.nav{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px;position:sticky;bottom:0;padding:12px 0 calc(4px + env(safe-area-inset-bottom));background:linear-gradient(180deg,rgba(248,243,233,0),var(--cream) 30%)}
.nav button{min-height:64px;border-radius:22px;border:1px solid var(--line);font-size:20px;font-weight:850;background:#fff}
.nav .primary{background:linear-gradient(135deg,var(--green),var(--green2));border-color:transparent;color:white}
.lesson-grid{display:grid;gap:14px;margin-top:23px}
.lesson-card{
  width:100%;text-align:left;border:1px solid var(--line);border-radius:24px;background:rgba(255,255,255,.9);
  padding:19px;box-shadow:var(--shadow);display:grid;grid-template-columns:56px 1fr 26px;gap:14px;align-items:center
}
.lesson-num{width:56px;height:56px;border-radius:18px;display:grid;place-items:center;background:#edf3f0;font-weight:900;color:var(--green);font-size:22px}
.lesson-card:nth-child(2) .lesson-num{background:#eef2f7;color:var(--blue)}
.lesson-card:nth-child(3) .lesson-num{background:#fbf1e1;color:#a77320}
.lesson-card:nth-child(4) .lesson-num{background:#f7ecee;color:var(--red)}
.lesson-title{font-size:20px;font-weight:900;margin-bottom:3px}.lesson-desc{color:var(--muted);font-size:14px;line-height:1.4}
.arrow{font-size:25px;color:#87908b}
.motif{
  margin:34px -18px -28px;height:80px;border-radius:50% 50% 0 0/28% 28% 0 0;
  background:
   linear-gradient(45deg,transparent 44%,rgba(255,255,255,.16) 45% 50%,transparent 51%) 0 0/25px 25px,
   linear-gradient(-45deg,transparent 44%,rgba(183,75,82,.20) 45% 50%,transparent 51%) 0 0/40px 40px,
   #375d79;
  position:relative;overflow:hidden
}
.motif::after{content:"✿";position:absolute;right:22px;top:-8px;font-size:60px;color:#fff8e9;text-shadow:0 2px 7px rgba(0,0,0,.08)}
.pilltitle{display:inline-flex;align-items:center;gap:8px;background:#eef3f0;color:var(--green);font-size:12px;font-weight:900;letter-spacing:.14em;text-transform:uppercase;border-radius:99px;padding:8px 11px;margin-bottom:10px}
.memoryPrompt{font-size:24px;font-weight:850;line-height:1.42;margin:5px 0 6px}
.writehelp{font-size:16px;color:var(--muted);line-height:1.5;margin-bottom:14px}
.canvaswrap{
  height:235px;background:#fff;border:1.5px solid #d7ded9;border-radius:22px;position:relative;overflow:hidden;touch-action:none
}
.canvaswrap::before,.canvaswrap::after{content:"";position:absolute;left:7%;right:7%;border-top:2px dashed #e5e7e5;pointer-events:none}
.canvaswrap::before{top:33%}.canvaswrap::after{top:71%}
canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
.tools{display:flex;gap:10px;margin-top:12px}.tools button{min-height:48px;padding:0 16px;border:1px solid var(--line);background:white;border-radius:15px;font-weight:750}
.sentence{font-size:26px;font-weight:850;line-height:1.42;margin:6px 0 15px}
.tiles{display:flex;gap:9px;flex-wrap:wrap}
.tile{border:1px solid var(--line);border-radius:14px;padding:12px 14px;background:#fff;font-weight:800}
.answerline{min-height:62px;border:2px dashed #d8ddda;border-radius:18px;padding:9px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:12px 0}
.audio{width:64px;height:64px;border-radius:50%;border:0;background:var(--green);color:white;font-size:27px}
.smallnote{font-size:13px;color:#909792;line-height:1.5}
.finish{text-align:center;padding:34px 10px}.finish .big{font-size:62px}.finish h2{font-family:Georgia,serif;font-size:34px;margin:7px 0}.finish p{color:var(--muted);font-size:18px;line-height:1.55}
.hidden{display:none!important}
@media(max-width:480px){
 .shell{padding-left:14px;padding-right:14px}
 .card{padding:20px 16px;border-radius:24px}
 .qthai{font-size:24px}.qenglish{font-size:16px}
 .options{gap:10px}.option{min-height:78px;font-size:19px;padding:10px}
 h1{font-size:43px}.subtitle{font-size:18px}
 .brandmark{font-size:12px}
}

/* --- Scotland × Thailand visual layer --- */
.flag-svg{width:30px;height:20px;border-radius:3px;box-shadow:0 1px 4px rgba(0,0,0,.10);display:block}
.brandmark.flags{gap:7px}
.cultural-scene{
  position:absolute;right:-10px;top:0;width:245px;height:145px;pointer-events:none;opacity:.88;
}
.hero.has-scene{min-height:190px;padding-right:210px}
.hero.has-scene::after{display:none}
.scene-castle{fill:#6f93b8;opacity:.23}
.scene-hill{fill:#89a6a0;opacity:.16}
.scene-temple{fill:#c79a46;opacity:.28}
.scene-flower{fill:#fffaf0;stroke:#c79a46;stroke-width:1.3}
.scene-leaf{fill:#547d67;opacity:.42}
.learn-card{padding:26px}
.learn-word{font-family:Georgia,"Times New Roman",serif;font-size:46px;line-height:1.05;margin:8px 0 4px;letter-spacing:-.02em}
.learn-thai{font-size:26px;font-weight:850;line-height:1.35;margin:7px 0 16px}
.learn-example{padding:16px 18px;background:#f4f7f5;border:1px solid #e1e6e2;border-radius:18px;margin-top:15px}
.learn-example .eng{font-size:21px;font-weight:800;line-height:1.45}
.learn-example .th{font-size:16px;color:var(--muted);margin-top:5px;line-height:1.45}
.learn-pron{display:inline-flex;align-items:center;gap:8px;color:var(--green);font-weight:800;background:#edf4f0;padding:9px 12px;border-radius:999px;margin-top:8px}
.learn-tip{font-size:14px;color:#7d8781;line-height:1.5;margin-top:14px}
.home-kicker{display:flex;align-items:center;gap:8px;font-size:13px;letter-spacing:.15em;font-weight:850;color:#65716b;text-transform:uppercase}
@media(max-width:680px){
  .hero.has-scene{padding-right:0;min-height:auto}
  .cultural-scene{width:150px;height:100px;right:-18px;top:-2px;opacity:.42}
  .hero.has-scene h1,.hero.has-scene .subtitle,.hero.has-scene .eyebrow{position:relative;z-index:1;max-width:82%}
}

</style>
</head>
<body>
<main class="shell">
  <div id="app"></div>
</main>

  {type:"write",th:'เขียนคำภาษาอังกฤษที่หมายถึง “เหนื่อยมาก” จากความจำ',en:"Write the English word from memory.",answer:"exhausted"},
  {type:"write",th:'เขียนคำภาษาอังกฤษที่หมายถึง “แออัด / คนเยอะ” จากความจำ',en:"Write the English word from memory.",answer:"crowded"}
 ]
];

let view="home", lesson=0, step=0, correctLocked=false;
const app=document.getElementById("app");

function topBar(back=true){
 return `<div class="brandrow">
   ${back?`<button class="backbtn" onclick="goHome()">← บทเรียน</button>`:`<div class="brandmark flags">${scotlandFlag()}<span>SCOTLAND × THAILAND</span>${thailandFlag()}</div>`}
   ${back?`<div class="brandmark flags">${scotlandFlag()}<span>×</span>${thailandFlag()}</div>`:""}
 </div>`;
}
function home(){
 view="home";
 app.innerHTML=`${topBar(false)}
 <section class="hero has-scene">
  ${culturalScene()}
  <div class="eyebrow">English with Lewis</div>
  <h1>Patty’s English Lesson</h1>
  <p class="subtitle">เรียนทีละนิด ใช้ได้จริง และจำจากความเข้าใจ 🌿</p>
  <div class="bridge"><span>SCOTLAND</span><span class="line"></span><span>THAILAND</span></div>
 </section>
 <div class="lesson-grid">
 ${lessons.map((l,i)=>`<button class="lesson-card" onclick="startLesson(${i})">
   <div class="lesson-num">${i+1}</div>
   <div><div class="lesson-title">${l.title}</div><div class="lesson-desc">${l.th}<br>${l.desc}</div></div>
   <div class="arrow">›</div>
 </button>`).join("")}
 </div>
 <div class="motif"></div>`;
 window.scrollTo(0,0);
}
function startLesson(i){lesson=i;step=0;view="lesson";renderLesson()}
function goHome(){home()}
function next(){ if(step < lessonData[lesson].length-1){step++;renderLesson()} else finishLesson() }
function prev(){ if(step>0){step--;renderLesson()} else goHome() }

function renderLesson(){
 view="lesson"; correctLocked=false;
 const item=lessonData[lesson][step], pct=((step+1)/lessonData[lesson].length*100);
 app.innerHTML=`${topBar(true)}
 <section class="hero has-scene">
  ${culturalScene()}
  <div class="eyebrow">LESSON ${lesson+1} OF 5</div>
  <h1>${lessons[lesson].title}</h1>
  <p class="subtitle">${lessons[lesson].th}</p>
 </section>
 <div class="progresswrap"><div class="progressbar"><div style="width:${pct}%"></div></div></div>
 <section id="activity">${activityHTML(item)}</section>
 <div class="nav">
   <button onclick="prev()">← ย้อนกลับ</button>
   <button class="primary" onclick="next()">ต่อไป →</button>
 </div>`;
 afterRender(item);
 window.scrollTo(0,0);
}
function questionHead(th,en,icon="📖"){
 return `<div class="quizhead"><div class="iconbubble">${icon}</div><div><div class="qthai">${th}</div><div class="qenglish">${en}</div></div></div>`;
}
function activityHTML(item){
 if(item.type==="learn"){
   return `<div class="card learn-card">
     <div class="pilltitle">📖 NEW WORD / คำใหม่</div>
     <div class="learn-word">${item.word}</div>
     <div class="learn-thai">${item.thai}</div>
     <div class="learn-pron">🔊 ออกเสียง: ${item.pron}</div>
     <div class="learn-example">
       <div class="eng">${item.example}</div>
       <div class="th">${item.exampleTh}</div>
     </div>
     <div class="learn-tip">จำคำนี้ไว้ก่อน — หน้าถัดไปจะถามโดยไม่บอกคำตอบให้ดู</div>
   </div>`;
 }
 if(item.type==="quiz"){
   return `<div class="card">${questionHead(item.th,item.en)}
    <div class="options">${item.opts.map(x=>`<button class="option" data-value="${esc(x)}">${x}</button>`).join("")}</div>
    <div id="fb" class="feedback"></div>
   </div>`;
 }
 if(item.type==="write"){
   return `<div class="card">
    <div class="pilltitle">✍️ MEMORY WRITING</div>
    <div class="memoryPrompt">${item.th}</div>
    <div class="writehelp">${item.en}<br><strong>ไม่มีคำให้ลอกนะ 👀</strong> — ลองนึกเองก่อน</div>
    <div class="canvaswrap"><canvas id="draw"></canvas></div>
    <div class="tools"><button id="clear">ลบ / Clear</button></div>
    <div class="smallnote" style="margin-top:12px">คำตอบจะไม่แสดงบนหน้าจอนี้ เพื่อให้ได้ฝึกจากความจำจริง ๆ</div>
   </div>`;
 }
 if(item.type==="listen"){
   return `<div class="card">${questionHead(item.th,"Tap the speaker, listen, then choose the Thai meaning.","🎧")}
    <button class="audio" id="speak" aria-label="Play audio">🔊</button>
    <div class="smallnote" style="margin:8px 0 16px">กดฟังซ้ำได้</div>
    <div class="options">${item.opts.map(x=>`<button class="option" data-value="${esc(x)}">${x}</button>`).join("")}</div>
    <div id="fb" class="feedback"></div>
   </div>`;
 }
 if(item.type==="build"){
   return `<div class="card">${questionHead(item.th,item.en,"🧩")}
     <div class="answerline" id="answerline"><span class="smallnote">แตะคำด้านล่างเพื่อเรียงประโยค</span></div>
     <div class="tiles" id="tiles">${item.words.map((x,i)=>`<button class="tile" data-i="${i}" data-word="${esc(x)}">${x}</button>`).join("")}</div>
     <div class="tools"><button id="resetbuild">เริ่มใหม่ / Reset</button><button id="checkbuild">ตรวจคำตอบ / Check</button></div>
     <div id="fb" class="feedback"></div>
   </div>`;
 }
}
function esc(s){return s.replaceAll("&","&amp;").replaceAll('"',"&quot;").replaceAll("<","&lt;")}
function afterRender(item){
 if(item.type==="learn"){
   const p=document.querySelector(".learn-pron");
   if(p) p.onclick=()=>{
     if("speechSynthesis" in window){
       speechSynthesis.cancel();
       const u=new SpeechSynthesisUtterance(item.word);
       u.lang="en-GB";u.rate=.78;speechSynthesis.speak(u);
     }
   };
 }
 if(item.type==="quiz" || item.type==="listen"){
   document.querySelectorAll(".option").forEach(b=>b.onclick=()=>checkOption(b,item.a));
 }
 if(item.type==="listen"){
   document.getElementById("speak").onclick=()=>{
     if("speechSynthesis" in window){
       speechSynthesis.cancel();
       const u=new SpeechSynthesisUtterance(item.text);u.lang="en-GB";u.rate=.82;speechSynthesis.speak(u);
     }
   };
 }
 if(item.type==="write") setupDrawing(document.getElementById("draw"));
 if(item.type==="build") setupBuild(item);
}
function checkOption(btn,ans){
 const fb=document.getElementById("fb");
 if(btn.dataset.value===ans){
   document.querySelectorAll(".option").forEach(b=>{b.disabled=true;if(b.dataset.value===ans)b.classList.add("correct")});
   fb.className="feedback good";fb.textContent="เก่งมาก อ้วน ❤️ ถูกต้อง!";
 }else{
   btn.classList.add("wrong");fb.className="feedback bad";fb.textContent="ยังไม่ถูก ลองอีกครั้งนะ 😏";
   setTimeout(()=>btn.classList.remove("wrong"),550);
 }
}
function setupBuild(item){
 let built=[];
 const line=document.getElementById("answerline"), tiles=document.querySelectorAll(".tile");
 function draw(){
   line.innerHTML=built.length?built.map((x,i)=>`<button class="tile" data-pos="${i}">${x}</button>`).join(""):`<span class="smallnote">แตะคำด้านล่างเพื่อเรียงประโยค</span>`;
   line.querySelectorAll(".tile").forEach(b=>b.onclick=()=>{const pos=+b.dataset.pos;built.splice(pos,1);draw();sync()});
 }
 function sync(){
   const used={};built.forEach(w=>used[w]=(used[w]||0)+1);
   tiles.forEach(t=>{
     const w=t.dataset.word, before=[...tiles].filter(x=>x.dataset.word===w && +x.dataset.i < +t.dataset.i).length;
     t.disabled=(used[w]||0)>before;
   });
 }
 tiles.forEach(t=>t.onclick=()=>{built.push(t.dataset.word);draw();sync()});
 document.getElementById("resetbuild").onclick=()=>{built=[];draw();tiles.forEach(t=>t.disabled=false);document.getElementById("fb").textContent=""};
 document.getElementById("checkbuild").onclick=()=>{
   const fb=document.getElementById("fb"),ok=JSON.stringify(built)===JSON.stringify(item.answer);
   fb.className="feedback "+(ok?"good":"bad");
   fb.textContent=ok?"เก่งมาก อ้วน ❤️ ประโยคถูกต้อง!":"ยังไม่ถูก ลองเรียงใหม่อีกครั้งนะ";
 };
}
function setupDrawing(canvas){
 const ctx=canvas.getContext("2d");let drawing=false,last=null;
 function resize(){
  const r=canvas.getBoundingClientRect(),d=Math.max(1,devicePixelRatio||1);
  canvas.width=Math.round(r.width*d);canvas.height=Math.round(r.height*d);
  ctx.setTransform(d,0,0,d,0,0);ctx.lineWidth=6;ctx.lineCap="round";ctx.lineJoin="round";ctx.strokeStyle="#17231f";
 }
 resize();
 const point=e=>{const r=canvas.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}};
 canvas.addEventListener("pointerdown",e=>{e.preventDefault();drawing=true;last=point(e);try{canvas.setPointerCapture(e.pointerId)}catch(_){}},{passive:false});
 canvas.addEventListener("pointermove",e=>{if(!drawing)return;e.preventDefault();const p=point(e);ctx.beginPath();ctx.moveTo(last.x,last.y);ctx.lineTo(p.x,p.y);ctx.stroke();last=p},{passive:false});
 ["pointerup","pointercancel","pointerleave"].forEach(n=>canvas.addEventListener(n,()=>{drawing=false;last=null}));
 document.getElementById("clear").onclick=()=>ctx.clearRect(0,0,canvas.width,canvas.height);
}
function finishLesson(){
 app.innerHTML=`${topBar(true)}
 <div class="card finish">
  <div class="big">🏴‍☠️🇹🇭</div>
  <h2>Lesson ${lesson+1} complete!</h2>
  <p><strong>เก่งมาก อ้วน ❤️</strong><br>Patty ทำบทเรียนนี้เสร็จแล้ว</p>
  <button class="primary" style="min-height:58px;border:0;border-radius:18px;padding:0 22px;font-weight:850" onclick="goHome()">กลับไปหน้าบทเรียน</button>
 </div>
 <div class="motif"></div>`;
 window.scrollTo(0,0);
}
home();
</script>
