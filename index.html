<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><title>English Lesson 1 — Thai Beginner</title><style>
:root{--bg:#f7f4ed;--card:#fff;--ink:#17211d;--muted:#66716b;--accent:#205b4a;--line:#d9ddd9;--good:#e8f4ed;--bad:#fff0ed}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html{-webkit-text-size-adjust:100%}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,sans-serif;background:var(--bg);color:var(--ink)}main{max-width:820px;margin:auto;padding:calc(14px + env(safe-area-inset-top)) 14px calc(18px + env(safe-area-inset-bottom))}.top{display:flex;justify-content:space-between;gap:10px;align-items:end}.small{color:var(--muted);font-size:14px}h1{font-size:26px;margin:4px 0}.bar{height:9px;background:#ddd;border-radius:99px;overflow:hidden;margin:14px 0 22px}.bar>div{height:100%;background:var(--accent);width:12.5%;transition:.2s}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:14px}.heroLetter{font-size:92px;font-weight:800;line-height:1}.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px}.pill{padding:12px;border:1px solid var(--line);border-radius:14px}.thai{font-size:16px;color:var(--muted)}button{font:inherit;min-height:46px;border:1px solid var(--line);background:white;border-radius:12px;padding:10px 15px;color:var(--ink)}button.primary{background:var(--accent);color:white;border-color:var(--accent)}button:disabled{opacity:.4}.nav{display:flex;justify-content:space-between;gap:10px;position:relative;z-index:999}.trace{position:relative;height:270px;background:white;border:1px solid var(--line);border-radius:16px;overflow:hidden;touch-action:none}.trace .ghost{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font:bold 190px Arial;color:#e3e6e4;pointer-events:none}.trace:before,.trace:after{content:"";position:absolute;left:5%;right:5%;border-top:2px dashed #e1e3e1;pointer-events:none}.trace:before{top:24%}.trace:after{top:76%}canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;-webkit-user-select:none;user-select:none}.choices{display:flex;flex-wrap:wrap;gap:9px}.choices button{font-weight:700;font-size:18px}.feedback{min-height:28px;margin-top:10px;font-weight:650}.word{font-size:42px;font-weight:800;letter-spacing:.08em}.writeLine{height:90px;border-bottom:2px solid var(--ink);position:relative}.writeLine canvas{height:90px}.alphabet{display:grid;grid-template-columns:repeat(7,1fr);gap:7px}.alphabet span{text-align:center;padding:10px 3px;border:1px solid var(--line);border-radius:9px;background:#fff;font-weight:700}.hidden{display:none}.checkrow{display:grid;grid-template-columns:1fr;gap:12px}.finish{text-align:center;padding:30px 10px}.stars{font-size:42px}@media(max-width:430px){h1{font-size:22px}.top{align-items:flex-start}.pair{grid-template-columns:1fr}.trace{height:230px}.trace .ghost{font-size:155px}.card{padding:14px;border-radius:15px}.heroLetter{font-size:76px}.nav{position:sticky;bottom:0;background:var(--bg);padding:10px 0 calc(4px + env(safe-area-inset-bottom));z-index:999}.nav button{flex:1}.alphabet{grid-template-columns:repeat(6,1fr)}}@media(min-width:600px){.checkrow{grid-template-columns:1fr 1fr}.alphabet{grid-template-columns:repeat(13,1fr)}}
.welcome-note{margin:14px 0;padding:14px;border:1px solid var(--border);border-radius:14px;line-height:1.55}.welcome-note span{display:block;margin-top:5px}</style></head><body><main><div class="top"><div><div class="small">สำหรับผู้เริ่มต้น • LESSON 1</div><h1>Patty’s English Lesson</h1></div><div><b id="page">1</b>/9</div></div><div class="bar"><div id="progress"></div></div><section id="stage"></section><div class="nav"><button id="back">← Back</button><button id="next" class="primary">Next →</button></div></main><script>
const letters=[{U:'A',l:'a',name:'ay',sound:'แอะ / a',word:'apple',th:'แอปเปิล',emoji:''},{U:'M',l:'m',name:'em',sound:'มมม / m',word:'mum',th:'แม่',emoji:''},{U:'C',l:'c',name:'see',sound:'ค / k',word:'cat',th:'แมว',emoji:''},{U:'T',l:'t',name:'tee',sound:'ท / t',word:'tea',th:'ชา',emoji:''}];let step=0,drawCleanup=()=>{};const stage=document.querySelector('#stage'),next=document.querySelector('#next'),back=document.querySelector('#back');
function drawing(canvas){
 const ctx=canvas.getContext('2d');let on=false,last=null;
 function size(){
   const r=canvas.getBoundingClientRect(),d=Math.max(1,window.devicePixelRatio||1);
   canvas.width=Math.max(1,Math.round(r.width*d));canvas.height=Math.max(1,Math.round(r.height*d));
   ctx.setTransform(d,0,0,d,0,0);ctx.lineWidth=7;ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle='#17211d'
 }
 size();
 function point(clientX,clientY){const r=canvas.getBoundingClientRect();return{x:clientX-r.left,y:clientY-r.top}}
 function begin(x,y){on=true;last=point(x,y)}
 function draw(x,y){if(!on)return;const q=point(x,y);ctx.beginPath();ctx.moveTo(last.x,last.y);ctx.lineTo(q.x,q.y);ctx.stroke();last=q}
 function endDraw(){on=false;last=null}
 const pd=e=>{e.preventDefault();begin(e.clientX,e.clientY);try{canvas.setPointerCapture(e.pointerId)}catch(_){}};
 const pm=e=>{if(!on)return;e.preventDefault();draw(e.clientX,e.clientY)};
 const pu=e=>{if(on)e.preventDefault();endDraw()};
 const ts=e=>{if(!e.touches.length)return;e.preventDefault();const t=e.touches[0];begin(t.clientX,t.clientY)};
 const tm=e=>{if(!on||!e.touches.length)return;e.preventDefault();const t=e.touches[0];draw(t.clientX,t.clientY)};
 const te=e=>{if(on)e.preventDefault();endDraw()};
 const md=e=>{e.preventDefault();begin(e.clientX,e.clientY)};
 const mm=e=>{if(on){e.preventDefault();draw(e.clientX,e.clientY)}};
 const mu=e=>{if(on)e.preventDefault();endDraw()};
 if(window.PointerEvent){
   canvas.addEventListener('pointerdown',pd,{passive:false});
   canvas.addEventListener('pointermove',pm,{passive:false});
   canvas.addEventListener('pointerup',pu,{passive:false});
   canvas.addEventListener('pointercancel',pu,{passive:false});
 }else{
   canvas.addEventListener('touchstart',ts,{passive:false});
   canvas.addEventListener('touchmove',tm,{passive:false});
   canvas.addEventListener('touchend',te,{passive:false});
   canvas.addEventListener('touchcancel',te,{passive:false});
   canvas.addEventListener('mousedown',md);
   window.addEventListener('mousemove',mm);
   window.addEventListener('mouseup',mu);
 }
 return()=>ctx.clearRect(0,0,canvas.width/(window.devicePixelRatio||1),canvas.height/(window.devicePixelRatio||1))
}
function letter(i){let x=letters[i];stage.innerHTML=`<div class="card"><div class="small">PART ${i+1} • NEW LETTER</div><div class="pair"><div><div class="heroLetter">${x.U} ${x.l}</div><p><b>${x.U}</b> is called <b>“${x.name}”</b>.</p><p class="thai">ชื่อของตัวอักษร: <b>${x.name}</b><br>เสียง: <b>${x.sound}</b></p></div><div class="pill"><div class="small">WORD / คำศัพท์</div><div style="font-size:46px">${x.emoji}</div><div class="word" style="font-size:30px">${x.word}</div><div class="thai">${x.th}</div></div></div></div><div class="card"><b>1. Trace the capital ${x.U}</b><div class="thai">ใช้นิ้วลากตามตัวอักษรสีจาง</div><div class="trace" style="margin-top:12px"><div class="ghost">${x.U}</div><canvas></canvas></div><button class="clear" style="margin-top:9px">Clear / ลบ</button></div><div class="card"><b>2. Say it aloud</b><p>“${x.U} — ${x.name} — ${x.word}.”</p><div class="thai">พูดออกเสียง 3 ครั้ง แล้วไปหน้าถัดไป</div></div>`;let clear=drawing(stage.querySelector('canvas'));stage.querySelector('.clear').onclick=clear}
function lowercase(){stage.innerHTML=`<div class="card"><div class="small">PART 5 • SMALL LETTERS</div><h2>Capital → small</h2><div class="thai">จับคู่ตัวพิมพ์ใหญ่กับตัวพิมพ์เล็ก</div><div class="checkrow" style="margin-top:14px">${letters.map(x=>`<div class="pill"><span style="font-size:44px;font-weight:800">${x.U}</span> → <span style="font-size:44px;font-weight:800">${x.l}</span></div>`).join('')}</div></div><div class="card"><b>Write the small letters with your finger</b><div class="thai">ลองเขียน a m c t ด้วยตัวเอง</div><div class="trace" style="margin-top:12px"><canvas></canvas></div><button class="clear" style="margin-top:9px">Clear / ลบ</button><button id="hint" style="margin-top:9px">Show hint / ดูตัวอย่าง</button><div id="hintText" class="word" style="margin-top:12px"></div></div>`;let clear=drawing(stage.querySelector('canvas'));stage.querySelector('.clear').onclick=clear;stage.querySelector('#hint').onclick=()=>stage.querySelector('#hintText').textContent='a   m   c   t'}
function read(){let qs=[[' แมว 🐱','CAT',['CAT','TEA','MUM']],[' ชา 🍵','TEA',['MUM','CAT','TEA']],[' แม่ 👩','MUM',['TEA','MUM','CAT']]];stage.innerHTML=`<div class="card"><div class="small">PART 6 • READING</div><h2>Can you read these words?</h2><div class="thai">เลือกคำภาษาอังกฤษที่ถูกต้อง</div><div id="qs"></div><div id="fb" class="feedback"></div></div>`;let done=new Set(),qbox=stage.querySelector('#qs');qs.forEach((q,i)=>{let d=document.createElement('div');d.className='pill';d.style.marginTop='12px';d.innerHTML=`<div style="font-size:22px;margin-bottom:8px">${q[0]}</div><div class="choices"></div>`;q[2].forEach(o=>{let b=document.createElement('button');b.textContent=o;b.onclick=()=>{if(o===q[1]){done.add(i);b.style.background='var(--good)';stage.querySelector('#fb').textContent=done.size===3?' Perfect! เก่งมาก อ้วน  อ่านถูกทั้งหมดแล้ว!':' Correct! เก่งมาก อ้วน  ถูกต้อง!'}else{b.style.background='var(--bad)';stage.querySelector('#fb').textContent='ยังไม่ถูก ลองอีกครั้งนะ'}};d.querySelector('.choices').appendChild(b)});qbox.appendChild(d)})}
function writeWord(){stage.innerHTML=`<div class="card"><div class="small">PART 7 • WRITING</div><h2>Write your first word</h2><p>Write <b>CAT</b> with your finger.</p><div class="thai">เขียนคำว่า CAT ด้วยนิ้ว โดยไม่ต้องลากตาม</div><div style="font-size:48px;margin:14px 0"> <b>CAT</b> = แมว</div><div class="trace"><canvas></canvas></div><button class="clear" style="margin-top:9px">Clear / ลบ</button></div><div class="card"><b>Spell it aloud:</b><div class="word">C – A – T</div><div class="thai">พูดชื่อแต่ละตัวอักษร แล้วพูดคำว่า “cat”</div></div>`;let clear=drawing(stage.querySelector('canvas'));stage.querySelector('.clear').onclick=clear}
function alphabet(){stage.innerHTML=`<div class="card"><div class="small">PART 8 • THE ALPHABET</div><h2>The English alphabet</h2><div class="thai">ภาษาอังกฤษมี 26 ตัวอักษร วันนี้เราเรียน 4 ตัว</div><div class="alphabet" style="margin-top:14px">${'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('').map(x=>`<span style="${['A','M','C','T'].includes(x)?'outline:3px solid var(--accent);background:var(--good)':''}">${x}<br><small>${x.toLowerCase()}</small></span>`).join('')}</div></div><div class="card finish"><div class="stars">⭐⭐⭐</div><h2>Lesson complete! </h2><div style="font-size:20px;font-weight:700;margin-bottom:8px">เก่งมาก อ้วน  ครูประทับใจมาก!</div><div class="thai">เก่งมาก อ้วน  วันนี้คุณเรียนรู้ตัวอักษร 4 ตัว</div><div class="word" style="margin:18px 0">A a · M m · C c · T t</div><p>You traced letters, wrote with your finger, read words and wrote <b>CAT</b>.</p><div class="thai">ครั้งต่อไป: ทบทวน 4 ตัวนี้ และเรียนตัวอักษรใหม่</div></div>`}
function welcomePage(){
 stage.innerHTML=`<div class="card">
   <div class="small">WELCOME TO LESSON 1</div>
   <h2 style="margin:6px 0 12px">Welcome, my beautiful new student ❤️</h2>
   <p><strong>I'm your teacher now, so you have to listen to me. No arguing with the teacher 😂</strong></p>
   <p class="thai" lang="th">ยินดีต้อนรับ นักเรียนคนสวยของฉัน ❤️ ตอนนี้ฉันเป็นครูภาษาอังกฤษของเธอแล้ว เพราะฉะนั้นต้องเชื่อฟังครูนะ ห้ามเถียงครู 😂</p>
   <p class="thai" lang="th">วันนี้เราจะเริ่มเรียนตัวอักษรภาษาอังกฤษแบบง่าย ๆ ทีละนิด</p>
 </div>`;
}
function render(){document.querySelector('#page').textContent=step+1;document.querySelector('#progress').style.width=((step+1)/9*100)+'%';back.disabled=step===0;next.textContent=step===7?'Start again ↻':'Next →';if(step===0)welcomePage();else if(step<5)letter(step-1);else if(step===4)lowercase();else if(step===5)read();else if(step===6)writeWord();else alphabet();window.scrollTo(0,0)}
function goNext(e){if(e){e.preventDefault();e.stopPropagation()}step=step===8?0:step+1;render()}
function goBack(e){if(e){e.preventDefault();e.stopPropagation()}if(step>0){step--;render()}}
next.addEventListener('click',goNext,false);
back.addEventListener('click',goBack,false);
next.addEventListener('touchend',function(e){e.preventDefault();goNext();},{passive:false});
back.addEventListener('touchend',function(e){e.preventDefault();goBack();},{passive:false});
render();
</script></body></html>
