<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover,user-scalable=no"><title>Independent Writing</title><style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;background:#fffaf4;color:#1f2925;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,sans-serif}main{max-width:760px;margin:auto;padding:20px 14px 34px}h1{font-size:27px}h2{font-size:22px;margin:5px 0 8px}p{line-height:1.5}.thaiQ{font-size:19px;font-weight:800;margin:7px 0 2px}.engQ{font-size:14px;color:#7a8580;margin:0 0 13px}.thai{color:#66736d}.small{font-size:12px;letter-spacing:.09em;color:#66736d;font-weight:800}.card,.lesson{background:#fff;border:1px solid #d9e1dd;border-radius:18px;padding:16px;margin:13px 0}.soft{background:#e9f2ee}.warm{background:#fff0e6}button,.btn{border:0;border-radius:13px;padding:13px 15px;font-size:16px;font-weight:750;min-height:48px;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}.primary{background:#2f6d5a;color:#fff}.secondary{background:#fff;color:#1f2925;border:1px solid #d9e1dd}.nav{position:sticky;bottom:0;z-index:20;background:#fffaf4;padding:10px 0;display:flex;gap:9px}.nav>*{flex:1}.progress{height:8px;background:#d9e1dd;border-radius:99px;overflow:hidden}.bar{height:100%;background:#2f6d5a}.options{display:grid;grid-template-columns:1fr 1fr;gap:9px}.options button,.chip{background:#fff;border:1px solid #d9e1dd;color:#1f2925}.ok{background:#e9f2ee!important}.feedback{min-height:30px;margin-top:10px;font-weight:800}.word{font-size:28px;font-weight:850}.meaning{font-size:18px;font-weight:750}input,textarea{width:100%;font-size:18px;padding:13px;border:1px solid #d9e1dd;border-radius:12px;font-family:inherit}textarea{min-height:115px}.trace{height:350px;position:relative;border:2px solid #d9e1dd;border-radius:18px;overflow:hidden;background:#fff;touch-action:none}.guide{position:absolute;left:10px;right:10px;border-top:1px dashed #cfd8d4;pointer-events:none}.g1{top:25%}.g2{top:50%}.g3{top:75%}canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}.grid{display:grid;gap:12px}.lesson{display:block;text-decoration:none;color:inherit}.tag{display:inline-block;padding:4px 9px;border-radius:99px;background:#e9f2ee;font-size:12px;font-weight:800}.chips{display:flex;flex-wrap:wrap;gap:8px}.built{min-height:55px;border:1px dashed #aebbb5;border-radius:13px;padding:12px;font-size:19px;margin:10px 0}.message{border-radius:16px;padding:13px 15px;margin:8px 0;background:#f0f1f2}.tip{font-size:13px;color:#7a8580}.write-actions{display:flex;margin-top:9px}.write-actions>*{flex:1}</style></head><body><main><a class="btn secondary" href="index.html">← บทเรียน</a><div class="small">LESSON 5 OF 5</div><h1>Independent Writing</h1><p class="thai">เขียนเองโดยมีตัวช่วยน้อยลง</p><div class="progress"><div id="bar" class="bar"></div></div><div id="stage"></div><div class="nav"><button id="back" class="secondary">← ย้อนกลับ</button><button id="next" class="primary">ต่อไป →</button></div></main><script>function setupDraw(c){const x=c.getContext('2d');let on=false,l=null;const r=c.getBoundingClientRect(),d=Math.max(1,devicePixelRatio||1);c.width=Math.round(r.width*d);c.height=Math.round(r.height*d);x.setTransform(d,0,0,d,0,0);x.lineWidth=3.2;x.lineCap='round';x.lineJoin='round';const p=e=>{const z=c.getBoundingClientRect();return{x:e.clientX-z.left,y:e.clientY-z.top}};c.addEventListener('pointerdown',e=>{e.preventDefault();on=true;l=p(e);try{c.setPointerCapture(e.pointerId)}catch(_){}},{passive:false});c.addEventListener('pointermove',e=>{if(!on)return;e.preventDefault();const q=p(e);x.beginPath();x.moveTo(l.x,l.y);x.lineTo(q.x,q.y);x.stroke();l=q},{passive:false});['pointerup','pointercancel'].forEach(t=>c.addEventListener(t,()=>on=false));return()=>x.clearRect(0,0,c.width,c.height)}const slides=["<div class=\"card\"><div class=\"small\">NEW WORD</div><div class=\"word\">delicious</div><p class=\"meaning\">อร่อยมาก</p><p class=\"thai\">ใช้บอกว่าอาหารอร่อย</p><p class=\"tip\">อ่านออกเสียง 3 ครั้ง แล้วกดต่อไป • Say it 3 times, then continue.</p></div>", "<div class=\"card\"><div class=\"small\">NEW WORD</div><div class=\"word\">recommend</div><p class=\"meaning\">แนะนำ</p><p class=\"thai\">ใช้เวลาบอกว่าคิดว่าคนอื่นควรลองอะไร</p><p class=\"tip\">อ่านออกเสียง 3 ครั้ง แล้วกดต่อไป • Say it 3 times, then continue.</p></div>", "<div class=\"card quiz\"><p class=\"thaiQ\">คำไหนหมายถึง “แนะนำ”?</p><p class=\"engQ\">Which word means recommend?</p><div class=\"options\"><button data-answer=\"0\">remember</button><button data-answer=\"1\">recommend</button><button data-answer=\"0\">receipt</button><button data-answer=\"0\">restaurant</button></div><div class=\"feedback\"></div></div>", "<div class=\"card\"><p class=\"thaiQ\">จากความจำ: สะกดคำภาษาอังกฤษที่แปลว่า “อร่อยมาก”</p><p class=\"engQ\">From memory: spell the word meaning delicious.</p><input id=\"delicious\" autocomplete=\"off\" autocapitalize=\"none\" spellcheck=\"false\"><button data-check=\"delicious\" data-value=\"delicious\" class=\"primary\" style=\"margin-top:9px\">ตรวจคำตอบ / Check</button><div class=\"feedback\"></div></div>", "<div class=\"card\"><p class=\"thaiQ\">เขียนคำภาษาอังกฤษที่แปลว่า “แนะนำ” จากความจำ</p><p class=\"engQ\">Handwrite the English word meaning recommend from memory.</p><p class=\"tip\">ไม่โชว์คำตอบแล้วนะ 😏</p><div class=\"trace\"><div class=\"guide g1\"></div><div class=\"guide g2\"></div><div class=\"guide g3\"></div><canvas></canvas></div><div class=\"write-actions\"><button data-clear class=\"secondary\">ลบ / Clear</button></div></div>", "<div class=\"card quiz\"><p class=\"thaiQ\">เลือกประโยคที่เป็นธรรมชาติที่สุด</p><p class=\"engQ\">Choose the most natural sentence.</p><div class=\"options\"><button data-answer=\"1\">The food was delicious. I recommend this place.</button><button data-answer=\"0\">The food delicious recommend.</button><button data-answer=\"0\">I delicious this restaurant.</button><button data-answer=\"0\">This recommend is food.</button></div><div class=\"feedback\"></div></div>", "<div class=\"card\"><p class=\"thaiQ\">เขียนอังกฤษ 2–3 ประโยค: วันนี้ทำอะไรมา และรู้สึกยังไง</p><p class=\"engQ\">Write 2–3 English sentences about what you did today and how you feel.</p><textarea></textarea></div>", "<div class=\"card\"><p class=\"thaiQ\">เขียน 1 ประโยคจากข้อความเมื่อกี้ด้วยนิ้ว โดยไม่ลอก</p><p class=\"engQ\">Handwrite one sentence from what you just wrote without copying.</p><p class=\"tip\">อ่านของตัวเองก่อน แล้วจำมาเขียน</p><div class=\"trace\"><div class=\"guide g1\"></div><div class=\"guide g2\"></div><div class=\"guide g3\"></div><canvas></canvas></div><div class=\"write-actions\"><button data-clear class=\"secondary\">ลบ / Clear</button></div></div>", "<div class=\"card\"><p class=\"thaiQ\">สถานการณ์: ไปกินร้านใหม่ อาหารอร่อยแต่แพง เขียนถึง Lewis 3–4 ประโยค</p><p class=\"engQ\">Situation: You tried a new restaurant. The food was delicious but expensive. Write Lewis 3–4 sentences.</p><textarea></textarea></div>", "<div class=\"card\"><p class=\"thaiQ\">เขียนประโยคสุดท้ายถึง Lewis ด้วยนิ้วเอง จะเขียนอะไรก็ได้ ❤️</p><p class=\"engQ\">Handwrite one final sentence to Lewis. Write anything you want.</p><p class=\"tip\"></p><div class=\"trace\"><div class=\"guide g1\"></div><div class=\"guide g2\"></div><div class=\"guide g3\"></div><canvas></canvas></div><div class=\"write-actions\"><button data-clear class=\"secondary\">ลบ / Clear</button></div></div>", "<div class=\"card soft\"><h2>เรียนครบแล้ว 🎉</h2><p class=\"thai\"><b>เก่งมากอ้วน ❤️</b> คราวนี้ไม่ได้ง่ายแล้วนะ 😂</p><p class=\"engQ\">Course complete!</p></div>"];let s=0,st=document.getElementById('stage'),bar=document.getElementById('bar'),back=document.getElementById('back'),next=document.getElementById('next');const praise='เก่งมากอ้วน ❤️';function good(f){f.textContent=praise+'  ถูกต้อง!'}function bind(){document.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>{let g=b.closest('.quiz'),f=g.querySelector('.feedback');if(b.dataset.answer==='1'){b.classList.add('ok');good(f)}else f.textContent='ยังไม่ถูก ลองอีกครั้งนะ'});document.querySelectorAll('[data-check]').forEach(b=>b.onclick=()=>{let i=document.getElementById(b.dataset.check),f=b.closest('.card').querySelector('.feedback'),a=b.dataset.value.toLowerCase().split('|');if(a.includes(i.value.trim().toLowerCase()))good(f);else f.textContent='เกือบแล้ว ลองอีกครั้งนะ'});document.querySelectorAll('[data-clear]').forEach(b=>{let c=setupDraw(b.closest('.card').querySelector('canvas'));b.onclick=c});document.querySelectorAll('[data-build]').forEach(g=>{let a=[],o=g.querySelector('.built'),f=g.querySelector('.feedback');g.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{a.push(c.textContent);o.textContent=a.join(' ')});g.querySelector('[data-reset]').onclick=()=>{a=[];o.textContent=''};g.querySelector('[data-buildcheck]').onclick=()=>{if(a.join(' ').toLowerCase()===g.dataset.build.toLowerCase())good(f);else f.textContent='ลำดับยังไม่ถูก ลองอีกครั้งนะ'}})}function render(){st.innerHTML=slides[s];bar.style.width=((s+1)/slides.length*100)+'%';back.disabled=s===0;next.textContent=s===slides.length-1?'เสร็จ ✓':'ต่อไป →';bind();scrollTo(0,0)}back.onclick=()=>{if(s>0){s--;render()}};next.onclick=()=>{if(s<slides.length-1){s++;render()}else location.href='index.html'};render();</script></body></html>
