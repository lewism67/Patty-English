<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover,user-scalable=no"><title>Read the Sounds</title><style>*{box-sizing:border-box}body{margin:0;background:#fffaf4;color:#1f2925;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,sans-serif}main{max-width:760px;margin:auto;padding:20px 15px 32px}h1{font-size:27px}p{line-height:1.55}.thai{color:#66736d}.small{font-size:12px;letter-spacing:.09em;color:#66736d;font-weight:800}.card,.lesson{background:#fff;border:1px solid #d9e1dd;border-radius:18px;padding:17px;margin:13px 0}.soft{background:#e9f2ee}.warm{background:#fff0e6}button,.btn{border:0;border-radius:13px;padding:13px 15px;font-size:16px;font-weight:750;min-height:48px;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}.primary{background:#2f6d5a;color:#fff}.secondary{background:#fff;color:#1f2925;border:1px solid #d9e1dd}.nav{position:sticky;bottom:0;background:#fffaf4;padding:10px 0;display:flex;gap:9px}.nav>*{flex:1}.progress{height:8px;background:#d9e1dd;border-radius:99px;overflow:hidden}.bar{height:100%;background:#2f6d5a}.options{display:grid;grid-template-columns:1fr 1fr;gap:9px}.options button,.chip{background:#fff;border:1px solid #d9e1dd;color:#1f2925}.ok{background:#e9f2ee!important}.feedback{min-height:30px;margin-top:10px;font-weight:800}.word{font-size:28px;font-weight:850}.letters{font-size:24px;font-weight:800;line-height:1.7}input,textarea{width:100%;font-size:18px;padding:13px;border:1px solid #d9e1dd;border-radius:12px}textarea{min-height:110px}.trace{height:210px;position:relative;border:1px solid #d9e1dd;border-radius:16px;overflow:hidden}canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}.grid{display:grid;gap:12px}.lesson{display:block;text-decoration:none;color:inherit}.tag{padding:4px 9px;border-radius:99px;background:#e9f2ee;font-size:12px;font-weight:800}.chips{display:flex;flex-wrap:wrap;gap:8px}.built{min-height:55px;border:1px dashed #aebbb5;border-radius:13px;padding:12px;font-size:19px;margin:10px 0}.message{border-radius:16px;padding:13px 15px;margin:8px 0;background:#f0f1f2}</style></head><body><main><a class="btn secondary" href="index.html">← Lessons</a><div class="small">LESSON 2 OF 5</div><h1>Read the Sounds</h1><p class="thai">ใช้เสียงเพื่ออ่านคำใหม่</p><div class="progress"><div id="bar" class="bar"></div></div><div id="stage"></div><div class="nav"><button id="back" class="secondary">← Back</button><button id="next" class="primary">Next →</button></div></main><script>function setupDraw(c){const x=c.getContext('2d');let on=false,l=null;const p=e=>{const r=c.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}};c.width=c.offsetWidth*devicePixelRatio;c.height=c.offsetHeight*devicePixelRatio;x.scale(devicePixelRatio,devicePixelRatio);x.lineWidth=7;x.lineCap='round';c.onpointerdown=e=>{e.preventDefault();on=true;l=p(e)};c.onpointermove=e=>{if(!on)return;e.preventDefault();const q=p(e);x.beginPath();x.moveTo(l.x,l.y);x.lineTo(q.x,q.y);x.stroke();l=q};c.onpointerup=c.onpointercancel=()=>on=false;return()=>x.clearRect(0,0,c.width,c.height)}const slides=["<div class=\"card\"><h2>Letters make sounds</h2><p><b>S + H = SH</b> like <b>shop</b>.</p><p class=\"thai\">ตัวอักษรสองตัวอาจรวมกันเป็นเสียงใหม่</p></div>", "<div class=\"card quiz\"><h2>Which starts with SH?</h2><div class=\"options\"><button data-answer=\"1\">shop</button><button data-answer=\"0\">cat</button><button data-answer=\"0\">phone</button><button data-answer=\"0\">night</button></div><div class=\"feedback\"></div></div>", "<div class=\"card quiz\"><h2>Which word has CH?</h2><div class=\"options\"><button data-answer=\"0\">ship</button><button data-answer=\"1\">chair</button><button data-answer=\"0\">three</button><button data-answer=\"0\">sleep</button></div><div class=\"feedback\"></div></div>", "<div class=\"card\"><h2>TH</h2><div class=\"word\">think • three • Thailand</div><p class=\"thai\">ลองอ่านออกเสียงดัง ๆ</p></div>", "<div class=\"card quiz\"><h2>Which word has EE?</h2><div class=\"options\"><button data-answer=\"0\">room</button><button data-answer=\"1\">sleep</button><button data-answer=\"0\">rain</button></div><div class=\"feedback\"></div></div>", "<div class=\"card quiz\"><h2>Which word has OO?</h2><div class=\"options\"><button data-answer=\"1\">food</button><button data-answer=\"0\">fish</button><button data-answer=\"0\">chair</button></div><div class=\"feedback\"></div></div>", "<div class=\"card\"><h2>AI + NG</h2><div class=\"word\">rain • train • sing • morning</div></div>", "<div class=\"card\"><h2>“โทรศัพท์” = ?  Hint: PH...</h2><input id=\"phone\"><button data-check=\"phone\" data-value=\"phone\" class=\"primary\" style=\"margin-top:9px\">Check</button><div class=\"feedback\"></div></div>", "<div class=\"card\"><h3>Write: shop • think • sleep • food • rain • morning</h3><div class=\"trace\"><canvas></canvas></div><button data-clear class=\"secondary\">Clear</button></div>", "<div class=\"card soft\"><h2>Lesson 2 complete ⭐</h2><p>SH, CH, TH, EE, OO, AI and NG.</p></div>"];let s=0,st=document.getElementById('stage'),bar=document.getElementById('bar'),back=document.getElementById('back'),next=document.getElementById('next');const praise='เก่งมากอ้วน ❤️';function good(f){f.textContent=praise+'  Correct!'}function bind(){document.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>{let g=b.closest('.quiz'),f=g.querySelector('.feedback');if(b.dataset.answer==='1'){b.classList.add('ok');good(f)}else f.textContent='ยังไม่ถูก ลองอีกครั้งนะ'});document.querySelectorAll('[data-check]').forEach(b=>b.onclick=()=>{let i=document.getElementById(b.dataset.check),f=b.closest('.card').querySelector('.feedback'),a=b.dataset.value.toLowerCase().split('|');if(a.includes(i.value.trim().toLowerCase()))good(f);else f.textContent='เกือบแล้ว ลองอีกครั้งนะ'});document.querySelectorAll('[data-clear]').forEach(b=>{let c=setupDraw(b.closest('.card').querySelector('canvas'));b.onclick=c});document.querySelectorAll('[data-build]').forEach(g=>{let a=[],o=g.querySelector('.built'),f=g.querySelector('.feedback');g.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{a.push(c.textContent);o.textContent=a.join(' ')});g.querySelector('[data-reset]').onclick=()=>{a=[];o.textContent=''};g.querySelector('[data-buildcheck]').onclick=()=>{if(a.join(' ').toLowerCase()===g.dataset.build.toLowerCase())good(f);else f.textContent='ลำดับยังไม่ถูก ลองอีกครั้งนะ'}})}function render(){st.innerHTML=slides[s];bar.style.width=((s+1)/slides.length*100)+'%';back.disabled=s===0;next.textContent=s===slides.length-1?'Finish ✓':'Next →';bind();scrollTo(0,0)}back.onclick=()=>{if(s>0){s--;render()}};next.onclick=()=>{if(s<slides.length-1){s++;render()}else location.href='index.html'};render();</script></body></html>
