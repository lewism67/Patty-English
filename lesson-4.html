<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover,user-scalable=no"><title>Read Real English</title><style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;background:#fffaf4;color:#1f2925;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,sans-serif}main{max-width:760px;margin:auto;padding:20px 14px 34px}h1{font-size:27px}h2{font-size:22px;margin:5px 0 8px}p{line-height:1.5}.thaiQ{font-size:19px;font-weight:800;margin:7px 0 2px}.engQ{font-size:14px;color:#7a8580;margin:0 0 13px}.thai{color:#66736d}.small{font-size:12px;letter-spacing:.09em;color:#66736d;font-weight:800}.card,.lesson{background:#fff;border:1px solid #d9e1dd;border-radius:18px;padding:16px;margin:13px 0}.soft{background:#e9f2ee}.warm{background:#fff0e6}button,.btn{border:0;border-radius:13px;padding:13px 15px;font-size:16px;font-weight:750;min-height:48px;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}.primary{background:#2f6d5a;color:#fff}.secondary{background:#fff;color:#1f2925;border:1px solid #d9e1dd}.nav{position:sticky;bottom:0;z-index:20;background:#fffaf4;padding:10px 0;display:flex;gap:9px}.nav>*{flex:1}.progress{height:8px;background:#d9e1dd;border-radius:99px;overflow:hidden}.bar{height:100%;background:#2f6d5a}.options{display:grid;grid-template-columns:1fr 1fr;gap:9px}.options button,.chip{background:#fff;border:1px solid #d9e1dd;color:#1f2925}.ok{background:#e9f2ee!important}.feedback{min-height:30px;margin-top:10px;font-weight:800}.word{font-size:28px;font-weight:850}.meaning{font-size:18px;font-weight:750}input,textarea{width:100%;font-size:18px;padding:13px;border:1px solid #d9e1dd;border-radius:12px;font-family:inherit}textarea{min-height:115px}.trace{height:350px;position:relative;border:2px solid #d9e1dd;border-radius:18px;overflow:hidden;background:#fff;touch-action:none}.guide{position:absolute;left:10px;right:10px;border-top:1px dashed #cfd8d4;pointer-events:none}.g1{top:25%}.g2{top:50%}.g3{top:75%}canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}.grid{display:grid;gap:12px}.lesson{display:block;text-decoration:none;color:inherit}.tag{display:inline-block;padding:4px 9px;border-radius:99px;background:#e9f2ee;font-size:12px;font-weight:800}.chips{display:flex;flex-wrap:wrap;gap:8px}.built{min-height:55px;border:1px dashed #aebbb5;border-radius:13px;padding:12px;font-size:19px;margin:10px 0}.message{border-radius:16px;padding:13px 15px;margin:8px 0;background:#f0f1f2}.tip{font-size:13px;color:#7a8580}.write-actions{display:flex;margin-top:9px}.write-actions>*{flex:1}</style></head><body><main><a class="btn secondary" href="index.html">← บทเรียน</a><div class="small">LESSON 4 OF 5</div><h1>Read Real English</h1><p class="thai">อ่านข้อความจริงและตอบจากความเข้าใจ</p><div class="progress"><div id="bar" class="bar"></div></div><div id="stage"></div><div class="nav"><button id="back" class="secondary">← ย้อนกลับ</button><button id="next" class="primary">ต่อไป →</button></div></main><script>function setupDraw(c){const x=c.getContext('2d');let on=false,l=null;const r=c.getBoundingClientRect(),d=Math.max(1,devicePixelRatio||1);c.width=Math.round(r.width*d);c.height=Math.round(r.height*d);x.setTransform(d,0,0,d,0,0);x.lineWidth=3.2;x.lineCap='round';x.lineJoin='round';const p=e=>{const z=c.getBoundingClientRect();return{x:e.clientX-z.left,y:e.clientY-z.top}};c.addEventListener('pointerdown',e=>{e.preventDefault();on=true;l=p(e);try{c.setPointerCapture(e.pointerId)}catch(_){}},{passive:false});c.addEventListener('pointermove',e=>{if(!on)return;e.preventDefault();const q=p(e);x.beginPath();x.moveTo(l.x,l.y);x.lineTo(q.x,q.y);x.stroke();l=q},{passive:false});['pointerup','pointercancel'].forEach(t=>c.addEventListener(t,()=>on=false));return()=>x.clearRect(0,0,c.width,c.height)}const slides=["<div class=\"card\"><p class=\"thaiQ\">อ่านข้อความนี้ให้จบก่อน แล้วค่อยตอบ</p><p class=\"engQ\">Read the whole message before answering.</p><div class=\"message\"><b>Lewis:</b> I made an appointment for tomorrow, but I’ll probably be finished by 3. The place is quite far away, so I might be late getting home.</div></div>", "<div class=\"card quiz\"><p class=\"thaiQ\">Lewis มีอะไรพรุ่งนี้?</p><p class=\"engQ\">What does Lewis have tomorrow?</p><div class=\"options\"><button data-answer=\"0\">A holiday</button><button data-answer=\"1\">An appointment</button><button data-answer=\"0\">A party</button><button data-answer=\"0\">A flight</button></div><div class=\"feedback\"></div></div>", "<div class=\"card quiz\"><p class=\"thaiQ\">Lewis คิดว่าน่าจะเสร็จกี่โมง?</p><p class=\"engQ\">What time will Lewis probably finish?</p><div class=\"options\"><button data-answer=\"0\">1</button><button data-answer=\"0\">2</button><button data-answer=\"1\">3</button><button data-answer=\"0\">4</button></div><div class=\"feedback\"></div></div>", "<div class=\"card quiz\"><p class=\"thaiQ\">ทำไม Lewis อาจกลับบ้านช้า?</p><p class=\"engQ\">Why might Lewis get home late?</p><div class=\"options\"><button data-answer=\"0\">He is exhausted.</button><button data-answer=\"1\">The place is far away.</button><button data-answer=\"0\">It is expensive.</button><button data-answer=\"0\">He lost a receipt.</button></div><div class=\"feedback\"></div></div>", "<div class=\"card\"><div class=\"small\">NEW WORD</div><div class=\"word\">worried</div><p class=\"meaning\">กังวล</p><p class=\"thai\">I'm worried = ฉันกังวล</p><p class=\"tip\">อ่านออกเสียง 3 ครั้ง แล้วกดต่อไป • Say it 3 times, then continue.</p></div>", "<div class=\"card\"><p class=\"thaiQ\">อ่านข้อความใหม่</p><p class=\"engQ\">Read the new message.</p><div class=\"message\"><b>Patty:</b> Okay, don’t worry. Message me when you’re finished. I’ll probably still be awake.</div></div>", "<div class=\"card quiz\"><p class=\"thaiQ\">Patty บอกให้ Lewis ทำอะไรเมื่อเสร็จ?</p><p class=\"engQ\">What does Patty ask Lewis to do when he is finished?</p><div class=\"options\"><button data-answer=\"0\">Call a restaurant</button><button data-answer=\"1\">Send her a message</button><button data-answer=\"0\">Go to sleep</button><button data-answer=\"0\">Find a receipt</button></div><div class=\"feedback\"></div></div>", "<div class=\"card\"><p class=\"thaiQ\">จากความจำ: สะกดคำภาษาอังกฤษที่แปลว่า “กังวล”</p><p class=\"engQ\">From memory: spell the word meaning worried.</p><input id=\"worried\" autocomplete=\"off\" autocapitalize=\"none\" spellcheck=\"false\"><button data-check=\"worried\" data-value=\"worried\" class=\"primary\" style=\"margin-top:9px\">ตรวจคำตอบ / Check</button><div class=\"feedback\"></div></div>", "<div class=\"card\"><p class=\"thaiQ\">เขียนคำตอบถึง Lewis ด้วยนิ้ว 1 ประโยค</p><p class=\"engQ\">Handwrite a one-sentence reply to Lewis.</p><p class=\"tip\">ไม่มีคำตอบเดียวที่ถูก</p><div class=\"trace\"><div class=\"guide g1\"></div><div class=\"guide g2\"></div><div class=\"guide g3\"></div><canvas></canvas></div><div class=\"write-actions\"><button data-clear class=\"secondary\">ลบ / Clear</button></div></div>", "<div class=\"card soft\"><h2>จบบทที่ 4 ⭐</h2></div>"];let s=0,st=document.getElementById('stage'),bar=document.getElementById('bar'),back=document.getElementById('back'),next=document.getElementById('next');const praise='เก่งมากอ้วน ❤️';function good(f){f.textContent=praise+'  ถูกต้อง!'}function bind(){document.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>{let g=b.closest('.quiz'),f=g.querySelector('.feedback');if(b.dataset.answer==='1'){b.classList.add('ok');good(f)}else f.textContent='ยังไม่ถูก ลองอีกครั้งนะ'});document.querySelectorAll('[data-check]').forEach(b=>b.onclick=()=>{let i=document.getElementById(b.dataset.check),f=b.closest('.card').querySelector('.feedback'),a=b.dataset.value.toLowerCase().split('|');if(a.includes(i.value.trim().toLowerCase()))good(f);else f.textContent='เกือบแล้ว ลองอีกครั้งนะ'});document.querySelectorAll('[data-clear]').forEach(b=>{let c=setupDraw(b.closest('.card').querySelector('canvas'));b.onclick=c});document.querySelectorAll('[data-build]').forEach(g=>{let a=[],o=g.querySelector('.built'),f=g.querySelector('.feedback');g.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{a.push(c.textContent);o.textContent=a.join(' ')});g.querySelector('[data-reset]').onclick=()=>{a=[];o.textContent=''};g.querySelector('[data-buildcheck]').onclick=()=>{if(a.join(' ').toLowerCase()===g.dataset.build.toLowerCase())good(f);else f.textContent='ลำดับยังไม่ถูก ลองอีกครั้งนะ'}})}function render(){st.innerHTML=slides[s];bar.style.width=((s+1)/slides.length*100)+'%';back.disabled=s===0;next.textContent=s===slides.length-1?'เสร็จ ✓':'ต่อไป →';bind();scrollTo(0,0)}back.onclick=()=>{if(s>0){s--;render()}};next.onclick=()=>{if(s<slides.length-1){s++;render()}else location.href='index.html'};render();</script></body></html>
