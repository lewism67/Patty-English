<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover,user-scalable=no"><title>Lesson 4 - Read &amp; Write</title><style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html{-webkit-text-size-adjust:100%}body{margin:0;background:#fffaf4;color:#1f2925;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,sans-serif}main{max-width:760px;margin:auto;padding:calc(18px + env(safe-area-inset-top)) 15px calc(28px + env(safe-area-inset-bottom))}h1{font-size:27px;margin:6px 0}h2{font-size:22px}p{line-height:1.55}.thai{color:#66736d}.small{font-size:12px;letter-spacing:.09em;color:#66736d;font-weight:800}.card,.lesson{background:#fff;border:1px solid #d9e1dd;border-radius:18px;padding:17px;margin:13px 0}.soft{background:#e9f2ee}.warm{background:#fff0e6}button,.btn{border:0;border-radius:13px;padding:13px 16px;font-size:16px;font-weight:750;min-height:48px;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}.primary{background:#2f6d5a;color:#fff}.secondary{background:#fff;color:#1f2925;border:1px solid #d9e1dd}.nav{position:sticky;bottom:0;z-index:20;background:#fffaf4f2;padding:10px 0 calc(6px + env(safe-area-inset-bottom));display:flex;gap:9px}.nav>*{flex:1}.progress{height:8px;background:#d9e1dd;border-radius:99px;overflow:hidden;margin:10px 0 16px}.bar{height:100%;background:#2f6d5a}.big{font-size:76px;font-weight:850;text-align:center}.trace{height:220px;position:relative;border:1px solid #d9e1dd;border-radius:16px;overflow:hidden;background:#fff}.ghost{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font:800 150px Arial;color:#dfe5e2;pointer-events:none}canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}.options{display:grid;grid-template-columns:1fr 1fr;gap:9px}.options button{background:#fff;border:1px solid #d9e1dd;color:#1f2925}.ok{background:#e9f2ee!important;border-color:#2f6d5a!important}.feedback{min-height:28px;margin-top:10px;font-weight:700}.word{font-size:31px;font-weight:850;letter-spacing:.04em}input{width:100%;font-size:18px;padding:13px;border:1px solid #d9e1dd;border-radius:12px}.grid{display:grid;gap:12px}.lesson{display:block;text-decoration:none;color:inherit}.tag{display:inline-block;padding:4px 9px;border-radius:99px;background:#e9f2ee;font-size:12px;font-weight:800}</style></head><body><main><a class="btn secondary" href="index.html">← Lessons</a><div class="small" style="margin-top:16px">LESSON 4 OF 5</div><h1>Read & Write</h1><p class="thai">ฝึกอ่าน พิมพ์ และเขียนคำที่ใช้ในชีวิตประจำวัน</p><div class="progress"><div id="bar" class="bar"></div></div><div id="stage"></div><div class="nav"><button id="back" class="secondary">← Back</button><button id="next" class="primary">Next →</button></div></main><script>function setupDraw(c){const x=c.getContext('2d');let on=false,last=null;const size=()=>{const r=c.getBoundingClientRect(),d=Math.max(1,devicePixelRatio||1);c.width=Math.round(r.width*d);c.height=Math.round(r.height*d);x.setTransform(d,0,0,d,0,0);x.lineWidth=7;x.lineCap='round';x.lineJoin='round';x.strokeStyle='#1f2925'};size();const p=e=>{const r=c.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}};c.addEventListener('pointerdown',e=>{e.preventDefault();on=true;last=p(e);try{c.setPointerCapture(e.pointerId)}catch(_){}});c.addEventListener('pointermove',e=>{if(!on)return;e.preventDefault();const q=p(e);x.beginPath();x.moveTo(last.x,last.y);x.lineTo(q.x,q.y);x.stroke();last=q});['pointerup','pointercancel'].forEach(t=>c.addEventListener(t,()=>on=false));return()=>x.clearRect(0,0,c.width,c.height)}const slides=["<div class=\"card\"><h2>Everyday words</h2><p class=\"thai\">ฝึกคำที่ใช้บ่อย ๆ</p><div class=\"word\">NAME • FOOD • HOME • LOVE</div></div>", "<div class=\"card quiz\"><h2>NAME</h2><p class=\"thai\">NAME หมายถึงอะไร?</p><div class=\"options\"><button data-answer=\"1\">ชื่อ</button><button data-answer=\"0\">บ้าน</button><button data-answer=\"0\">อาหาร</button></div><div class=\"feedback\"></div></div>", "<div class=\"card quiz\"><h2>FOOD 🍜</h2><p class=\"thai\">FOOD หมายถึงอะไร?</p><div class=\"options\"><button data-answer=\"0\">ชื่อ</button><button data-answer=\"1\">อาหาร</button><button data-answer=\"0\">รัก</button></div><div class=\"feedback\"></div></div>", "<div class=\"card quiz\"><h2>HOME 🏠</h2><p class=\"thai\">คำไหนแปลว่า “บ้าน”?</p><div class=\"options\"><button data-answer=\"0\">NAME</button><button data-answer=\"1\">HOME</button><button data-answer=\"0\">FOOD</button></div><div class=\"feedback\"></div></div>", "<div class=\"card\"><h2>Type your name</h2><p class=\"thai\">พิมพ์ชื่อของตัวเองเป็นภาษาอังกฤษ</p><input placeholder=\"Patty\"><p class=\"thai\">ตัวอย่าง: Patty</p></div>", "<div class=\"card\"><h2>Copy the words</h2><p class=\"thai\">เขียนตาม: Patty • food • home • love</p><div class=\"trace\"><canvas></canvas></div><button data-clear class=\"secondary\" style=\"margin-top:9px\">Clear</button></div>", "<div class=\"card quiz\"><h2>Quick reading</h2><p class=\"thai\">คำไหนแปลว่า “รัก” ❤️?</p><div class=\"options\"><button data-answer=\"0\">HOME</button><button data-answer=\"1\">LOVE</button><button data-answer=\"0\">NAME</button></div><div class=\"feedback\"></div></div>", "<div class=\"card soft\"><h2>Lesson 4 complete ⭐</h2><p class=\"thai\">บทต่อไปจะเริ่มเขียนประโยคจริง ๆ</p></div>"];let step=0;const stage=document.getElementById('stage'),bar=document.getElementById('bar'),back=document.getElementById('back'),next=document.getElementById('next');function bind(){document.querySelectorAll('[data-answer]').forEach(b=>b.addEventListener('click',()=>{const g=b.closest('.quiz'),f=g.querySelector('.feedback');if(b.dataset.answer==='1'){b.classList.add('ok');f.textContent='เก่งมาก! ⭐ Correct!'}else f.textContent='ยังไม่ถูก ลองอีกครั้งนะ'}));document.querySelectorAll('[data-clear]').forEach(b=>{const clear=setupDraw(b.closest('.card').querySelector('canvas'));b.addEventListener('click',clear)});document.querySelectorAll('[data-check]').forEach(b=>b.addEventListener('click',()=>{const i=document.getElementById(b.dataset.check),f=b.parentElement.querySelector('.feedback');f.textContent=i.value.trim().toLowerCase()===b.dataset.value.toLowerCase()?'เก่งมาก! ⭐ Correct!':'ลองอีกครั้งนะ • Try again'}))}function render(){stage.innerHTML=slides[step];bar.style.width=((step+1)/slides.length*100)+'%';back.disabled=step===0;back.style.opacity=step===0?'.45':'1';next.textContent=step===slides.length-1?'Finish ✓':'Next →';bind();window.scrollTo(0,0)}back.addEventListener('click',()=>{if(step>0){step--;render()}});next.addEventListener('click',()=>{if(step<slides.length-1){step++;render()}else location.href='index.html'});render();</script></body></html>
